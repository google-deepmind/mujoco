[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mujoco-core"
version = "4.0.1"
authors = [
    {name = "Google DeepMind", email = "mujoco@deepmind.com"},
]
description = "MuJoCo Physics Simulator (Core Bindings)"
requires-python = ">=3.11"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
]
dynamic = ["readme", "scripts"]

[project.urls]
Homepage = "https://github.com/google-deepmind/mujoco"
Documentation = "https://mujoco.readthedocs.io/en/4.0.1"
Repository = "https://github.com/google-deepmind/mujoco"
Changelog = "https://mujoco.readthedocs.io/en/4.0.1/changelog.html"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["mujoco", "mujoco.*"]
exclude = [
    "mujoco_full*",
    "mujoco._usd*",
    "mujoco.cmake*",
    "mujoco.codegen",
    "mujoco.doc*",
    "mujoco.mjpython",
    "mujoco.mujoco_full*",
    "mujoco.sample.studio*",
    "mujoco.simulate*",
    "mujoco.studio*",
    "mujoco.usd.MjcPhysics*",
]

[tool.setuptools.package-data]
mujoco = [
    "libmujoco.*.dylib",
    "libmujoco*.so.*",
    "mujoco.dll",
    "include/mujoco/*.h",
    "doc/*.rst",
    "doc/*/*.rst",
    "doc/skills/*.md",
    "doc/skills/*/*.md",
    "testdata/*.xml",
    "testdata/*.msh",
    "testdata/*.usda",
    "testdata/*.zip",
    "testdata/*.urdf",
    "sysid/report/templates/*.html",
]

[project.optional-dependencies]
rendering = [
    "glfw",
    "pyopengl",
]
sysid = [
    "absl-py",
    "colorama",
    "imageio[ffmpeg]",
    "jinja2",
    "matplotlib",
    "plotly",
    "pyyaml",
    "scipy",
    "tabulate",
    "typing_extensions",
]
usd = [
    "mujoco-usd==4.0.1; python_version<='3.13'",
    "pillow",
    "usd-core",
]

[tool.isort]
force_single_line = true
force_sort_within_sections = true
lexicographical = true
single_line_exclusions = ["typing"]
order_by_type = false
group_by_package = true
line_length = 120
use_parentheses = true
multi_line_output = 3
skip_glob = ["**/*.ipynb"]

[tool.pyink]
line-length = 80
unstable = true
pyink-indentation = 2
pyink-use-majority-quotes = true
extend-exclude = '''(
 .ipynb$
)'''
