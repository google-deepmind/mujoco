[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mujoco-metal-experimental"
version = "0.2.0"
description = "Optional generic MuJoCo model inspection and Metal kinematics prototype"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["mujoco==3.10.0", "numpy>=2,<3"]

[project.optional-dependencies]
metal = ["torch==2.9.1"]
test = ["absl-py", "pytest"]

[tool.setuptools.packages.find]
include = ["mujoco_metal*"]

[tool.setuptools.package-data]
mujoco_metal = ["shaders/*.metal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
